name: Auto patch and publish

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: auto-patch-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.release.outputs.ref }}
      release_sha: ${{ steps.release.outputs.sha }}
      main_ref: ${{ steps.main.outputs.ref }}
      main_sha: ${{ steps.main.outputs.sha }}
    steps:
      - name: Resolve release revision
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=$(gh api repos/QuantumNous/new-api/releases/latest --jq .tag_name)
          sha=$(git ls-remote https://github.com/QuantumNous/new-api.git "refs/tags/$ref^{}" "refs/tags/$ref" | head -1 | cut -f1)
          test -n "$sha"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve main revision
        id: main
        run: |
          sha=$(git ls-remote https://github.com/QuantumNous/new-api.git refs/heads/main | cut -f1)
          test -n "$sha"
          echo "ref=main" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: release
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - track: release
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - track: main
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - track: main
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Select upstream revision
        id: upstream
        run: |
          if [ "${{ matrix.track }}" = release ]; then
            ref='${{ needs.prepare.outputs.release_ref }}'
            sha='${{ needs.prepare.outputs.release_sha }}'
          else
            ref='${{ needs.prepare.outputs.main_ref }}'
            sha='${{ needs.prepare.outputs.main_sha }}'
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out upstream
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: QuantumNous/new-api
          ref: ${{ steps.upstream.outputs.sha }}
          path: upstream
          fetch-depth: 0

      - name: Check out patch queue
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: patch-queue

      - name: Apply patches
        working-directory: upstream
        run: |
          git config user.name 'new-api-audit-patch[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git am --3way ../patch-queue/patches/*.patch

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: |
            upstream/go.sum
            upstream/relaykit/go.sum

      - name: Install Go linter
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'

      - name: Install Go linter binary
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      - name: Verify patched source
        working-directory: upstream
        run: |
          mkdir -p web/dist && touch web/dist/index.html
          test -z "$(gofmt -l audit controller/relay.go model/log.go model/user.go model/user_cache.go)"
          git diff --check HEAD~3 HEAD
          golangci-lint run --new-from-rev=HEAD~3 ./...
          go vet ./...
          go build ./...
          make test
          cd relaykit && GOWORK=off go build ./...

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and publish
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: upstream
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/sommio/new-api-audit-patch:sha-${{ steps.upstream.outputs.sha }}-${{ matrix.arch }}
            ghcr.io/sommio/new-api-audit-patch:${{ matrix.track }}-sha-${{ steps.upstream.outputs.sha }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.track }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.track }}-${{ matrix.arch }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ghcr.io/sommio/new-api-audit-patch
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  manifest:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        track: [release, main]
    runs-on: ubuntu-latest
    steps:
      - name: Select upstream revision
        id: upstream
        run: |
          if [ "${{ matrix.track }}" = release ]; then
            echo "sha=${{ needs.prepare.outputs.release_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ needs.prepare.outputs.main_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-architecture manifests
        env:
          IMAGE: ghcr.io/sommio/new-api-audit-patch
          SHA: ${{ steps.upstream.outputs.sha }}
          TRACK: ${{ matrix.track }}
        run: |
          docker buildx imagetools create -t "$IMAGE:sha-$SHA" "$IMAGE:sha-$SHA-amd64" "$IMAGE:sha-$SHA-arm64"
          docker buildx imagetools create -t "$IMAGE:$TRACK-sha-$SHA" "$IMAGE:$TRACK-sha-$SHA-amd64" "$IMAGE:$TRACK-sha-$SHA-arm64"
